<script>
        // Simple Modal Logic
        function openPhotoModal(cardElement) {
            const img = cardElement.querySelector('img');
            const info = cardElement.querySelector('p').innerText;
            
            if(!img) return; // Ignore if skeleton clicked

            const modal = document.getElementById('photo-modal');
            const modalImg = document.getElementById('modal-image');
            const modalInfo = document.getElementById('modal-info');

            modalImg.src = img.src;
            modalInfo.innerText = info;
            
            modal.classList.add('active');
            document.body.style.overflow = 'hidden'; // Prevent scrolling under modal
        }

        function closePhotoModal() {
            const modal = document.getElementById('photo-modal');
            modal.classList.remove('active');
            document.body.style.overflow = '';
        }
    </script>
