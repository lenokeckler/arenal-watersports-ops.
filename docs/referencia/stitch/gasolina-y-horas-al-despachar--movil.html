<body class="bg-background text-on-surface font-body-base antialiased selection:bg-primary selection:text-on-primary">
<div class="min-h-screen flex flex-col relative overflow-hidden">
<!-- Background Gradient/Glow Effect -->
<div class="absolute inset-0 pointer-events-none overflow-hidden z-0">
<div class="absolute top-[-20%] left-[-10%] w-[50%] h-[50%] rounded-full bg-primary/10 blur-[120px]"></div>
</div>
<!-- TopAppBar (Transactional - Hidden for focused task, using a custom back header instead) -->

<button class="w-10 h-10 rounded-full bg-surface-variant flex items-center justify-center text-on-surface hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="ml-4 flex flex-col">
<span class="font-label-mono text-label-mono text-primary uppercase tracking-wider">Despacho</span>
<h1 class="font-title-md text-title-md">JS-04 Yamaha VX</h1>
</div>
</header>
<!-- Main Content -->
<main class="flex-grow flex flex-col p-margin-mobile z-10 max-w-md mx-auto w-full gap-lg">
<!-- Machine Info Card -->
<div class="relative rounded-xl overflow-hidden bg-surface-container/70 backdrop-blur-xl border border-white/10 p-sm shadow-xl flex items-center gap-4">
<div class="w-20 h-20 rounded-lg overflow-hidden shrink-0 bg-surface-variant">
<img class="w-full h-full object-cover" data-alt="A sleek, modern Yamaha VX wave runner jet ski viewed from a high angle. The machine is parked on a dock. Dark background with dramatic teal studio lighting reflecting off the metallic hull, highlighting its aggressive lines and sporty design." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDweC2_PS7xdTZjUFu7g_zH12pbUTM667qNtq5VdXN7lkiLLQAleK8QIHVlO9AyEK_LCPulth_T3lyXQElBudwNDkHJHnDmC16KO2BV1Z5ITDuVMgjSNXe6ytx0VrApeWFLgxdKHKnfJi4QBngJBKppBSHTUD922rPOQ3Suze0q_yjrZ85MnzaVDnYiwrXKuM455ltALXRYSNbiBIK7Sle_U9UBOD4bRX58puZTM2WCjShz5zHxHfWHyNEbiO7yci6_U3DN1m7NuV7b"/>
</div>
<div class="flex flex-col">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-primary-fixed">JS-04</h2>
<span class="font-body-base text-body-base text-on-surface-variant">Yamaha VX Cruiser HO</span>
<div class="flex items-center gap-1 mt-2">
<span class="inline-flex px-2 py-1 rounded-full bg-primary-container/20 text-primary font-label-mono text-label-mono">Mantenimiento OK</span>
</div>
</div>
</div>
<!-- Fuel Level Selector -->

<div class="flex justify-between items-center">
<h3 class="font-title-md text-title-md flex items-center gap-2">
<span class="material-symbols-outlined text-primary">local_gas_station</span> Nivel de Gasolina
                    </h3>
</div>
<div class="grid grid-cols-4 gap-2">
<button class="fuel-btn bg-surface-container-high border border-white/10 rounded-lg py-4 flex flex-col items-center justify-center gap-2 hover:bg-surface-variant transition-all focus:outline-none" data-value="0.25">
<div class="w-8 h-4 rounded-sm border border-outline relative overflow-hidden">

</button>
<button class="fuel-btn bg-surface-container-high border border-white/10 rounded-lg py-4 flex flex-col items-center justify-center gap-2 hover:bg-surface-variant transition-all focus:outline-none" data-value="0.5">

<div class="w-8 h-4 rounded-sm border border-primary relative overflow-hidden">
<div class="absolute left-0 bottom-0 w-full h-full bg-primary transition-all duration-300"></div>
</div>
<span class="font-label-mono text-label-mono text-primary font-bold">Lleno</span>

                    </h3>

</div>

<span class="absolute right-6 top-1/2 -translate-y-1/2 font-label-mono text-title-md text-on-surface-variant">hrs</span>

<p class="text-xs text-on-surface-variant opacity-70">Debe ser mayor al último registro.</p>

<span class="material-symbols-outlined">send</span>
                    Registrar Salida
                </button>
</div>

<script>
        // Simple script for fuel button selection interaction
        document.querySelectorAll('.fuel-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                // Reset all
                document.querySelectorAll('.fuel-btn').forEach(b => {
                    b.classList.remove('bg-primary-container/20', 'border-primary', 'shadow-[inset_0_0_10px_rgba(87,241,219,0.2)]');
                    b.classList.add('bg-surface-container-high', 'border-white/10');
                    b.querySelector('span').classList.remove('text-primary', 'font-bold');
                    b.querySelector('span').classList.add('text-on-surface');
                    b.querySelector('.border').classList.remove('border-primary');
                    b.querySelector('.border').classList.add('border-outline');
                });
                
                // Set active
                this.classList.remove('bg-surface-container-high', 'border-white/10');
                this.classList.add('bg-primary-container/20', 'border-primary', 'shadow-[inset_0_0_10px_rgba(87,241,219,0.2)]');
                this.querySelector('span').classList.remove('text-on-surface');
                this.querySelector('span').classList.add('text-primary', 'font-bold');
                this.querySelector('.border').classList.remove('border-outline');
                this.querySelector('.border').classList.add('border-primary');
            });
        });
    </script>
