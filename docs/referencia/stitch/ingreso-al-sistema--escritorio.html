<style>
        body {
            background-color: #020617; /* Deep Navy foundation */
            background-image: radial-gradient(circle at 50% 50%, rgba(11, 19, 38, 0.8) 0%, rgba(2, 6, 23, 1) 100%);
        }
        
        /* Glassmorphism Panel */
        .glass-panel {
            background-color: rgba(30, 41, 59, 0.7); /* Level 1 Base */
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Input Fields */
        .glass-input {
            background-color: rgba(11, 19, 38, 0.6); /* Inset dark */
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        .glass-input:focus-within {
            border-color: #57f1db; /* Primary Teal */
            box-shadow: inset 0 0 0 1px #57f1db;
        }

        /* Primary Button */
        .btn-primary {
            background-color: #57f1db;
            color: #0b1326;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.5);

<body class="min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop text-on-surface antialiased overflow-hidden relative">
<!-- Atmospheric Background Glows -->
<div class="absolute top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
<div class="absolute top-[-20%] left-[-10%] w-[50%] h-[50%] rounded-full bg-primary/10 blur-[120px]"></div>
<div class="absolute bottom-[-20%] right-[-10%] w-[40%] h-[40%] rounded-full bg-tertiary-container/10 blur-[100px]"></div>
</div>
<!-- Main Login Container -->
<main class="w-full max-w-md glass-panel rounded-xl shadow-2xl p-md md:p-lg flex flex-col gap-lg relative z-10">
<!-- Error Banner (Requested) -->
<div class="bg-error-container/80 backdrop-blur-md border border-error/50 rounded-lg p-sm flex items-center gap-sm" role="alert">
<span class="material-symbols-outlined text-error" style="font-variation-settings: 'FILL' 1;">error</span>
<span class="font-body-base text-body-base text-on-error-container">Acceso Denegado</span>
</div>
<!-- Header Section -->
<header class="flex flex-col items-center text-center gap-sm">
<!-- Circular Logo -->
<div class="w-20 h-20 rounded-full bg-surface-container-high border border-white/10 flex items-center justify-center mb-sm shadow-[0_0_20px_rgba(87,241,219,0.1)]">
<img class="w-12 h-12 object-contain rounded-full" data-alt="A high-tech, minimalist circular logo for a water sports operations command center. The logo features abstract fluid geometric waves interwoven with rigid technical grid lines. The primary colors are deep navy blue and bright neon teal. The style is sleek, professional, and slightly futuristic, emphasizing precision and fluidity. Rendered on a transparent background." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCu5bwLenVoH4fos0YpDkmbtLzybNN3MWSH3ADaWQcjbvtBDtnDOUvOoLHfcXLmCXX002uPitGWnklIEyQ2QApHHsb9Y8ZVoaeJjsoV4PA_6kN3o3RyqXsWR7r9dFSm5mrDaIm0mFOkU9ye3bBuLU4fmr3_s1FtUsohyhBnEMye_eDgO8pJMmVl2p2b-iUjZtop5dR0lIOkAuLY4zpEOfWR5D55vCOMfjlIK7zamckEMaQC8N_WoeoYXdvPC662akHmYvFd0GU-inVD"/>
</div>
<h1 class="font-display-lg text-display-lg text-primary tracking-tight">
                Arenal Ops
            </h1>
<p class="font-body-base text-body-base text-on-surface-variant">
                Centro de Mando Operativo
            </p>
</header>
<!-- Login Form -->
<form class="flex flex-col gap-md" onsubmit="event.preventDefault();">
<!-- User / Operator ID Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-mono text-label-mono text-on-surface-variant uppercase" for="username">Usuario / ID Operador</label>
<div class="glass-input rounded-lg flex items-center px-sm py-sm group">
<span class="material-symbols-outlined text-on-surface-variant group-focus-within:text-primary transition-colors mr-sm" style="font-variation-settings: 'FILL' 0;">person</span>
<input class="w-full bg-transparent border-none text-on-surface font-body-base text-body-base focus:ring-0 p-0 placeholder-on-surface-variant/50" id="username" placeholder="Ingrese su ID" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-mono text-label-mono text-on-surface-variant uppercase" for="password">Contraseña</label>
<div class="glass-input rounded-lg flex items-center px-sm py-sm group">
<span class="material-symbols-outlined text-on-surface-variant group-focus-within:text-primary transition-colors mr-sm" style="font-variation-settings: 'FILL' 0;">lock</span>
<input class="w-full bg-transparent border-none text-on-surface font-body-base text-body-base focus:ring-0 p-0 placeholder-on-surface-variant/50" id="password" placeholder="••••••••" type="password"/>
<button aria-label="Mostrar/ocultar contraseña" class="text-on-surface-variant hover:text-on-surface focus:outline-none ml-sm transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="visibility-icon" style="font-variation-settings: 'FILL' 0;">visibility</span>
</button>
</div>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end mt-[-8px]">
<a class="font-label-mono text-label-mono text-on-surface-variant hover:text-primary transition-colors" href="#">¿Olvidó su contraseña?</a>
</div>
<!-- Submit Button -->
<button class="btn-primary w-full py-sm rounded-lg font-button text-button uppercase tracking-widest mt-sm" type="submit">
                ENTRAR AL SISTEMA
            </button>
</form>
<!-- Footer subtly -->
<footer class="mt-auto text-center pt-md border-t border-white/5">
<p class="font-label-mono text-label-mono text-on-surface-variant/50">
                © 2024 Arenal Ops. Acceso Restringido.
            </p>
</footer>
</main>
<script>
        // Simple password toggle logic for the prototype
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const visibilityIcon = document.getElementById('visibility-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                visibilityIcon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                visibilityIcon.textContent = 'visibility';
            }
        }
    </script>
