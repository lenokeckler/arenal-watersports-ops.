<style>
        body {
            background-color: #020617;
            background-image: radial-gradient(circle at 50% -20%, #060e20 0%, #020617 80%);
            color: theme('colors.on-background');
            min-height: 100vh;
        }
        
        .glass-panel {
            background-color: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .glass-input {
            background-color: theme('colors.surface-dim');
            border: 1px solid theme('colors.outline-variant');
            color: theme('colors.on-surface');
            transition: all 0.2s ease;
        }
        
        .glass-input:focus {
            outline: none;
            border-color: theme('colors.primary');
            box-shadow: inset 0 0 0 1px theme('colors.primary');
        }
        
        .glass-input::placeholder {
            color: theme('colors.on-surface-variant');
            opacity: 0.7;
        }
        
        /* Interactive Elements Layer 2 Glow */
        .interactive-glow:active {
            box-shadow: inset 0 0 12px 2px rgba(255, 179, 176, 0.4);
        }
        
        .severity-radio:checked + label {
            background-color: theme('colors.surface-variant');
            border-color: theme('colors.primary');
            box-shadow: inset 0 0 0 1px theme('colors.primary');
        }

        .severity-radio-coral:checked + label {
            background-color: theme('colors.surface-variant');
            border-color: theme('colors.secondary');
            box-shadow: inset 0 0 0 1px theme('colors.secondary');
        }
        
        /* Hide scrollbar for photo grid */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

<!-- Main Content Canvas -->
<main class="flex-1 mt-[80px] px-margin-mobile flex flex-col gap-md max-w-lg mx-auto w-full md:hidden">
<div class="mb-sm">
<h2 class="font-title-md text-title-md text-on-surface mb-xs">Reporte de Daño</h2>
<p class="font-body-base text-body-base text-on-surface-variant text-sm">Registra incidencias de equipo de forma inmediata.</p>
</div>
<!-- Unidad Selector -->
<div class="glass-panel rounded-xl p-md flex flex-col gap-sm">
<label class="font-label-mono text-label-mono text-on-surface-variant uppercase tracking-wider">Unidad Afectada</label>
<div class="relative">
<select class="glass-input w-full appearance-none rounded-lg p-sm pr-xl font-body-base text-body-base cursor-pointer">
<option disabled="" selected="" value="">Seleccionar Código de Unidad</option>
<option value="JS-01">JS-01 (Jet Ski Alpha)</option>
<option value="JS-02">JS-02 (Jet Ski Bravo)</option>
<option value="JS-03">JS-03 (Jet Ski Charlie)</option>
<option value="JS-04">JS-04 (Jet Ski Delta)</option>
<option value="K-01">K-01 (Kayak Doble)</option>
</select>
<div class="absolute inset-y-0 right-0 flex items-center pr-sm pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</div>
<!-- Descripción -->
<div class="glass-panel rounded-xl p-md flex flex-col gap-sm">
<label class="font-label-mono text-label-mono text-on-surface-variant uppercase tracking-wider">Descripción del Daño</label>
<textarea class="glass-input w-full rounded-lg p-sm font-body-base text-body-base resize-none h-32" placeholder="Describe los detalles de la incidencia, ruidos inusuales o partes rotas..."></textarea>
</div>
<!-- Gravedad -->
<div class="glass-panel rounded-xl p-md flex flex-col gap-sm">
<label class="font-label-mono text-label-mono text-on-surface-variant uppercase tracking-wider">Nivel de Gravedad</label>
<div class="grid grid-cols-3 gap-xs">
<div>
<input class="severity-radio hidden" id="sev-leve" name="severity" type="radio" value="leve"/>
<label class="flex flex-col items-center justify-center p-sm rounded-lg border border-outline-variant/30 cursor-pointer transition-colors bg-surface-dim hover:bg-surface-variant/50" for="sev-leve">
<span class="material-symbols-outlined mb-xs text-primary/70">info</span>
<span class="font-label-mono text-label-mono text-center">Leve</span>
</label>
</div>
<div>
<input class="severity-radio hidden" id="sev-mod" name="severity" type="radio" value="moderado"/>
<label class="flex flex-col items-center justify-center p-sm rounded-lg border border-outline-variant/30 cursor-pointer transition-colors bg-surface-dim hover:bg-surface-variant/50" for="sev-mod">
<span class="material-symbols-outlined mb-xs text-tertiary">warning</span>
<span class="font-label-mono text-label-mono text-center">Moderado</span>
</label>
</div>
<div>
<input class="severity-radio-coral hidden" id="sev-crit" name="severity" type="radio" value="critico"/>
<label class="flex flex-col items-center justify-center p-sm rounded-lg border border-outline-variant/30 cursor-pointer transition-colors bg-surface-dim hover:bg-surface-variant/50" for="sev-crit">
<span class="material-symbols-outlined mb-xs text-secondary">error</span>
<span class="font-label-mono text-label-mono text-center">Crítico</span>
</label>
</div>
</div>
</div>
<!-- Fotos Adjuntas -->
<div class="glass-panel rounded-xl p-md flex flex-col gap-sm">
<div class="flex justify-between items-center mb-xs">
<label class="font-label-mono text-label-mono text-on-surface-variant uppercase tracking-wider">Evidencia Fotográfica</label>
<span class="font-label-mono text-label-mono text-on-surface-variant opacity-70">0/4</span>
</div>
<div class="flex gap-sm overflow-x-auto no-scrollbar pb-xs">
<!-- Botón de Cámara Central/Principal -->
<button class="min-w-[100px] h-[100px] rounded-lg border-2 border-dashed border-outline-variant/50 flex flex-col items-center justify-center gap-xs bg-surface-dim hover:bg-surface-variant/50 transition-colors text-primary flex-shrink-0">
<span class="material-symbols-outlined text-[32px]">photo_camera</span>
<span class="font-label-mono text-label-mono text-[10px]">Capturar</span>
</button>
<!-- Slots vacíos de previsualización -->
<div class="min-w-[100px] h-[100px] rounded-lg border border-outline-variant/20 bg-surface-dim/50 flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-on-surface-variant/30">image</span>
</div>
<div class="min-w-[100px] h-[100px] rounded-lg border border-outline-variant/20 bg-surface-dim/50 flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-on-surface-variant/30">image</span>
</div>
<div class="min-w-[100px] h-[100px] rounded-lg border border-outline-variant/20 bg-surface-dim/50 flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-on-surface-variant/30">image</span>
</div>
</div>
</div>
<!-- Acción Principal -->
<div class="mt-md mb-xl">
<button class="w-full bg-secondary text-on-secondary font-button text-button uppercase tracking-wider py-md rounded-lg shadow-lg interactive-glow transition-all active:scale-95 flex justify-center items-center gap-sm">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">report</span>
                Reportar Daño
            </button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 rounded-t-xl bg-surface-container-low/70 dark:bg-surface-container-low/70 backdrop-blur-xl border-t border-outline-variant/10 shadow-2xl md:hidden">

<span class="font-label-mono text-label-mono text-[10px]">Inventory</span>

<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant/30 w-full h-full rounded-lg active:scale-90 transition-transform duration-200" href="#">
<span class="material-symbols-outlined mb-xs">settings</span>
<span class="font-label-mono text-label-mono text-[10px]">Admin</span>

</nav>
