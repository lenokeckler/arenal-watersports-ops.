<script>
        // Simple script to handle radio button visual selection state
        document.addEventListener('DOMContentLoaded', () => {
            const labels = document.querySelectorAll('label');
            
            labels.forEach(label => {
                const radio = label.querySelector('input[type="radio"]');
                const panel = label.querySelector('div.rounded-xl');
                const icon = label.querySelector('.material-symbols-outlined');
                const title = label.querySelector('h2');
                
                // Get the custom radio indicator elements
                const indicatorContainer = label.querySelector('.rounded-full.border-2');
                
                if (radio.checked) {
                    setAsSelected(panel, icon, title, indicatorContainer);
                }

                radio.addEventListener('change', (e) => {
                    // Reset all
                    labels.forEach(l => {
                        const r = l.querySelector('input[type="radio"]');
                        const p = l.querySelector('div.rounded-xl');
                        const ic = l.querySelector('.material-symbols-outlined');
                        const t = l.querySelector('h2');
                        const ind = l.querySelector('.rounded-full.border-2');
                        
                        setAsUnselected(p, ic, t, ind);
                    });
                    
                    // Set current
                    if(e.target.checked) {
                        setAsSelected(panel, icon, title, indicatorContainer);
                    }
                });
            });

            function setAsSelected(panel, icon, title, indicator) {
                // Panel classes
                panel.classList.remove('glass-panel', 'group-hover:border-white/20', 'group-hover:bg-surface-container-high/80');
                panel.classList.add('glass-panel-selected');
                
                // Icon container & icon
                const iconContainer = icon.parentElement;
                iconContainer.classList.remove('bg-surface-variant', 'border-white/5', 'group-hover:border-white/10');
                iconContainer.classList.add('bg-primary/20', 'border-primary/30');
                icon.classList.remove('text-on-surface-variant');
                icon.classList.add('text-primary');
                icon.setAttribute('data-weight', 'fill');
                
                // Title
                title.classList.remove('group-hover:text-primary');
                
                // Price text
                const priceDiv = panel.querySelector('.border-t');
                const priceText = priceDiv.querySelector('span');
                priceDiv.classList.remove('border-white/5', 'group-hover:border-white/10');
                priceDiv.classList.add('border-white/10');
                priceText.classList.remove('text-on-surface-variant');
                priceText.classList.add('text-primary');

                // Custom radio indicator
                indicator.classList.remove('border-outline-variant', 'group-hover:border-outline');
                indicator.classList.add('border-primary');
                if(!indicator.querySelector('div')) {
                    indicator.innerHTML = '<div class="w-3 h-3 rounded-full bg-primary"></div>';
                }
            }

            function setAsUnselected(panel, icon, title, indicator) {
                 // Panel classes
                 panel.classList.remove('glass-panel-selected');
                 panel.classList.add('glass-panel', 'group-hover:border-white/20', 'group-hover:bg-surface-container-high/80');
                 
                 // Icon container & icon
                 const iconContainer = icon.parentElement;
                 iconContainer.classList.remove('bg-primary/20', 'border-primary/30');
                 iconContainer.classList.add('bg-surface-variant', 'border-white/5', 'group-hover:border-white/10');
                 icon.classList.remove('text-primary');
                 icon.classList.add('text-on-surface-variant');
                 icon.removeAttribute('data-weight');
                 
                 // Title
                 title.classList.add('group-hover:text-primary');
                 
                 // Price text
                 const priceDiv = panel.querySelector('.border-t');
                 const priceText = priceDiv.querySelector('span');
                 priceDiv.classList.remove('border-white/10');
                 priceDiv.classList.add('border-white/5', 'group-hover:border-white/10');
                 priceText.classList.remove('text-primary');
                 priceText.classList.add('text-on-surface-variant');

                 // Custom radio indicator
                 indicator.classList.remove('border-primary');
                 indicator.classList.add('border-outline-variant', 'group-hover:border-outline');
                 indicator.innerHTML = '';
            }
        });
    </script>
