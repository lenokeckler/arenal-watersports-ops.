<script>
        // Simple interactions for toggles to change visual states
        document.querySelectorAll('.toggle-checkbox').forEach(toggle => {
            toggle.addEventListener('change', (e) => {
                const card = e.target.closest('.glass-panel');
                const statusText = card.querySelector('.text-on-surface-variant, .text-outline, .text-error:not(.uppercase)');
                
                if(e.target.checked) {
                    card.classList.remove('opacity-70');
                    card.classList.add('active-glow');
                    if(statusText) {
                        statusText.textContent = 'DISPONIBLE';
                        statusText.className = 'font-label-mono text-label-mono text-on-surface-variant';
                    }
                    setTimeout(() => card.classList.remove('active-glow'), 500);
                } else {
                    card.classList.add('opacity-70');
                    if(statusText) {
                        statusText.textContent = 'DESCANSO';
                        statusText.className = 'font-label-mono text-label-mono text-outline';
                    }
                }
            });
        });
    </script>
