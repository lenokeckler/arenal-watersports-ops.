<style>
        body {
            background-color: #020617;
            background-image: radial-gradient(circle at top right, rgba(45, 212, 191, 0.05), transparent 40%),
                              radial-gradient(circle at bottom left, rgba(87, 241, 219, 0.05), transparent 40%);
            background-attachment: fixed;
        }
        
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .glass-card:hover {
            background: rgba(30, 41, 59, 0.85);
            box-shadow: inset 0 0 15px rgba(87, 241, 219, 0.2), 0 8px 30px rgba(0, 0, 0, 0.5);
            border-color: rgba(87, 241, 219, 0.3);
            transform: translateY(-4px);
        }

        .glass-card:active {
            transform: translateY(0) scale(0.98);
        }

        .mode-icon-container {
            transition: all 0.3s ease;
        }
        
        .glass-card:hover .mode-icon-container {
            color: theme('colors.primary');
            transform: scale(1.1);
            text-shadow: 0 0 20px rgba(87, 241, 219, 0.5);
        }

        .glass-card:hover .mode-title {
            color: theme('colors.primary');
        }

        /* Checkbox styling */
        .custom-checkbox {
            appearance: none;
            background-color: transparent;
            margin: 0;
            font: inherit;
            width: 1.15em;
            height: 1.15em;
            border: 1px solid theme('colors.outline');
            border-radius: 0.15em;
            display: grid;
            place-content: center;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }

        .custom-checkbox::before {
            content: "";
            width: 0.65em;
            height: 0.65em;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em theme('colors.background');
            background-color: theme('colors.primary');
            transform-origin: center;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }

        .custom-checkbox:checked {
            background-color: theme('colors.primary');
            border-color: theme('colors.primary');
            box-shadow: 0 0 10px rgba(87, 241, 219, 0.3);
        }

        .custom-checkbox:checked::before {
            transform: scale(1);
        }
        
        .custom-checkbox:focus {
            outline: 2px solid theme('colors.primary-fixed-dim');
            outline-offset: 2px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-on-surface font-body-base min-h-screen flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop overflow-hidden">
<!-- TopAppBar Semantic Mapping: Hide nav for transactional/splash screens -->
<!-- Content Canvas -->
<main class="w-full max-w-4xl mx-auto flex flex-col items-center justify-center z-10">
<!-- Header Section -->
<div class="text-center mb-xl">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary font-bold mb-base tracking-tight">
                Arenal Ops
            </h1>
<h2 class="font-title-md text-title-md text-on-surface-variant">
                Seleccione su modo de trabajo
            </h2>
</div>
<!-- Mode Selection Grid -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-md md:gap-lg w-full mb-lg">
<!-- Operaciones Card -->
<button class="glass-card rounded-xl p-md flex flex-col items-center text-center group focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background">
<div class="mode-icon-container h-24 w-24 rounded-full bg-surface-container-high flex items-center justify-center mb-md border border-white/5 shadow-inner">
<span class="material-symbols-outlined text-[48px] text-on-surface-variant group-hover:text-primary transition-colors" style="font-variation-settings: 'FILL' 0, 'wght' 300;">
                        sailing
                    </span>
</div>
<h3 class="mode-title font-title-md text-title-md text-on-surface font-semibold mb-sm transition-colors">
                    Operaciones
                </h3>
<p class="font-body-base text-body-base text-on-surface-variant opacity-80">
                    Control de flota, personal en campo y seguimiento de unidades en tiempo real.
                </p>
</button>
<!-- Reservas Card -->
<button class="glass-card rounded-xl p-md flex flex-col items-center text-center group focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background">
<div class="mode-icon-container h-24 w-24 rounded-full bg-surface-container-high flex items-center justify-center mb-md border border-white/5 shadow-inner">
<span class="material-symbols-outlined text-[48px] text-on-surface-variant group-hover:text-primary transition-colors" style="font-variation-settings: 'FILL' 0, 'wght' 300;">
                        calendar_today
                    </span>
</div>
<h3 class="mode-title font-title-md text-title-md text-on-surface font-semibold mb-sm transition-colors">
                    Reservas
                </h3>
<p class="font-body-base text-body-base text-on-surface-variant opacity-80">
                    Gestión de clientes, programación de actividades y asignación de horarios.
                </p>
</button>
<!-- Admin Card -->
<button class="glass-card rounded-xl p-md flex flex-col items-center text-center group focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background">
<div class="mode-icon-container h-24 w-24 rounded-full bg-surface-container-high flex items-center justify-center mb-md border border-white/5 shadow-inner">
<span class="material-symbols-outlined text-[48px] text-on-surface-variant group-hover:text-primary transition-colors" style="font-variation-settings: 'FILL' 0, 'wght' 300;">
                        settings
                    </span>
</div>
<h3 class="mode-title font-title-md text-title-md text-on-surface font-semibold mb-sm transition-colors">
                    Administración
                </h3>
<p class="font-body-base text-body-base text-on-surface-variant opacity-80">
                    Configuración global, reportes financieros y gestión de inventario maestro.
                </p>
</button>
</div>
<!-- Remember Selection -->
<div class="flex items-center gap-sm mt-md">
<input class="custom-checkbox" id="remember-mode" type="checkbox"/>
<label class="font-label-mono text-label-mono text-on-surface-variant cursor-pointer hover:text-on-surface transition-colors" for="remember-mode">
                Recordar última selección
            </label>
</div>
</main>
<!-- Subtle background decoration -->
<div class="fixed top-0 left-0 w-full h-full pointer-events-none z-0 overflow-hidden">
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-primary opacity-[0.02] blur-[100px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] rounded-full bg-tertiary opacity-[0.02] blur-[120px]"></div>
</div>
</body></html>
