<script>
        // Password Visibility Toggle
        const togglePasswordBtn = document.getElementById('toggle-password');
        const passwordInput = document.getElementById('password');
        const toggleIcon = document.getElementById('toggle-icon');

        togglePasswordBtn.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            if (type === 'text') {
                toggleIcon.textContent = 'visibility_off';
                toggleIcon.setAttribute('data-icon', 'visibility_off');
            } else {
                toggleIcon.textContent = 'visibility';
                toggleIcon.setAttribute('data-icon', 'visibility');
            }
        });

        // Simulate Error State for demonstration
        function showError() {
            const errorMsg = document.getElementById('error-message');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            
            // Simple validation check to show error state
            if(usernameInput.value && passwordInput.value) {
                errorMsg.classList.remove('hidden');
                
                // Add error border to inputs
                usernameInput.classList.add('border-error/50', 'focus:border-error', 'focus:ring-error/20');
                passwordInput.classList.add('border-error/50', 'focus:border-error', 'focus:ring-error/20');
                
                // Remove standard glow to emphasize error
                usernameInput.classList.remove('input-glow', 'border-white/10');
                passwordInput.classList.remove('input-glow', 'border-white/10');

                // Shake animation on the container
                const container = errorMsg.parentElement;
                container.classList.add('animate-[shake_0.5s_ease-in-out]');
                
                // Clean up animation class
                setTimeout(() => {
                    container.classList.remove('animate-[shake_0.5s_ease-in-out]');
                }, 500);
            }
        }

        // Add custom shake animation to tailwind config via script
        tailwind.config.theme.extend.keyframes = {
            shake: {
                '0%, 100%': { transform: 'translateX(0)' },
                '10%, 30%, 50%, 70%, 90%': { transform: 'translateX(-5px)' },
                '20%, 40%, 60%, 80%': { transform: 'translateX(5px)' }
            }
        };
    </script>
