<!DOCTYPE html>

<style>
        body {
            background-color: #020617; /* Base level 0 as per guidelines */
            background-image: radial-gradient(circle at 50% 0%, rgba(13, 30, 60, 0.5) 0%, transparent 70%);
        }
        
        .glass-panel {
            background-color: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .glass-sheet {
            background-color: rgba(19, 27, 46, 0.85); /* surface-container-low modified for glass */
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.5);
        }

        .input-glow:focus-within {
            border-color: #57f1db;
            box-shadow: inset 0 0 0 1px #57f1db;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="text-on-surface font-body-base h-screen overflow-hidden flex flex-col relative w-full max-w-[390px] mx-auto antialiased">
<!-- Top App Bar (Semantic Shell - Not active on deep detail/transactional, but keeping standard for context) -->
<header class="fixed top-0 w-full z-50 flex items-center justify-between px-margin-mobile h-16 bg-surface/70 backdrop-blur-md border-b border-white/10 shadow-sm">
<div class="flex items-center gap-sm">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-white/5 active:scale-95 transition-transform text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary tracking-tight">RES-4892</h1>
</div>
<div class="flex items-center gap-xs">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-white/5 active:scale-95 transition-transform text-on-surface-variant">
<span class="material-symbols-outlined">more_vert</span>
</button>
</div>
</header>
<!-- Main Canvas (Background Content) -->
<main class="flex-1 overflow-y-auto pt-20 pb-24 px-margin-mobile flex flex-col gap-md opacity-40 transition-opacity duration-300 pointer-events-none">
<!-- Reservation Context Card -->
<div class="glass-panel rounded-xl p-md flex flex-col gap-sm relative overflow-hidden">
<div class="absolute top-0 right-0 p-3">
<span class="inline-flex items-center px-3 py-1 rounded-full bg-primary/10 text-primary font-label-mono text-label-mono uppercase">
                    Confirmada
                </span>
</div>
<div class="flex items-start gap-4">
<div class="w-16 h-16 rounded-lg bg-surface-container flex items-center justify-center shrink-0 border border-white/5">
<span class="material-symbols-outlined text-primary text-3xl">directions_boat</span>
</div>
<div>
<h2 class="font-title-md text-title-md text-on-surface mb-1">Jet Ski Yamaha EX</h2>
<p class="font-label-mono text-label-mono text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">schedule</span> 14:00 - 15:30 (90 min)
                    </p>
</div>
</div>
<div class="h-px w-full bg-white/10 my-2"></div>
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<span class="text-on-surface-variant text-sm">Cliente</span>
<span class="font-medium">Carlos Mendoza</span>
</div>
<div class="flex justify-between items-center">
<span class="text-on-surface-variant text-sm">Tarifa</span>
<span class="font-medium text-primary">$120.00</span>
</div>
</div>
</div>
<!-- Additional details skeleton -->
<div class="glass-panel rounded-xl p-md flex flex-col gap-3">
<div class="h-4 w-1/3 bg-surface-container rounded"></div>
<div class="h-10 w-full bg-surface-container rounded mt-2"></div>
<div class="h-10 w-full bg-surface-container rounded"></div>
</div>
</main>
<!-- Overlay -->
<div class="fixed inset-0 bg-black/60 z-[60] backdrop-blur-[2px]"></div>
<!-- Bottom Sheet (Modal) -->
<div class="fixed bottom-0 left-0 w-full z-[70] glass-sheet rounded-t-[24px] flex flex-col transform transition-transform duration-300 ease-out translate-y-0 max-w-[390px] mx-auto inset-x-0">
<!-- Drag Handle -->
<div class="w-full flex justify-center pt-4 pb-2">
<div class="w-12 h-1.5 rounded-full bg-white/20"></div>
</div>
<div class="px-margin-mobile pb-8 pt-4 flex flex-col gap-lg">
<!-- Header -->
<div class="flex flex-col gap-1 text-center">
<div class="w-12 h-12 rounded-full bg-error/10 flex items-center justify-center mx-auto mb-2">
<span class="material-symbols-outlined text-error text-2xl" style="font-variation-settings: 'FILL' 1;">warning</span>
</div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-on-surface">Cancelar Reserva</h2>
<p class="font-body-base text-body-base text-on-surface-variant">
                    La reserva dejará de verse en operaciones y pasará al historial.
                </p>
</div>
<!-- Form Area -->
<div class="flex flex-col gap-2">
<label class="font-label-mono text-label-mono uppercase tracking-wider text-on-surface-variant ml-1" for="cancel-reason">
                    Motivo de Cancelación <span class="text-error">*</span>
</label>
<div class="relative input-glow rounded-lg bg-surface-container/50 border border-white/10 overflow-hidden transition-colors">
<textarea class="w-full bg-transparent border-none text-on-surface font-body-base p-sm focus:ring-0 placeholder:text-on-surface-variant/50 resize-none" id="cancel-reason" placeholder="Ej. Cliente no se presentó, clima adverso..." rows="3"></textarea>
</div>
<p class="font-label-mono text-[10px] text-tertiary-fixed-dim/80 ml-1 mt-1 flex items-start gap-1">
<span class="material-symbols-outlined text-[12px] mt-[1px]">info</span>
                    Sin motivo el historial no explica nada.
                </p>
</div>
<!-- Actions -->
<div class="flex flex-col gap-3 mt-2">
<button class="w-full py-4 rounded-xl bg-error text-on-error font-button text-button uppercase tracking-wide hover:bg-error/90 active:scale-[0.98] transition-all shadow-[inset_0_2px_4px_rgba(255,255,255,0.2)] flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[18px]">block</span>
                    Confirmar Cancelación
                </button>
<button class="w-full py-4 rounded-xl border border-white/10 bg-transparent text-on-surface font-button text-button uppercase tracking-wide hover:bg-white/5 active:scale-[0.98] transition-all flex items-center justify-center">
                    Volver
                </button>
</div>
</div>
</div>
</body></html>
