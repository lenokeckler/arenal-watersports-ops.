<!DOCTYPE html>

<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Nuevo Conteo de Inventario</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "outline-variant": "#3c4a46",
                    "primary-container": "#2dd4bf",
                    "on-primary-container": "#00574d",
                    "inverse-primary": "#006b5f",
                    "inverse-surface": "#dae2fd",
                    "surface-container-lowest": "#060e20",
                    "surface-container-highest": "#2d3449",
                    "error-container": "#93000a",
                    "secondary-fixed": "#ffdad8",
                    "surface-container": "#171f33",
                    "on-surface-variant": "#bacac5",
                    "on-background": "#dae2fd",
                    "on-error-container": "#ffdad6",
                    "surface-container-low": "#131b2e",
                    "primary-fixed-dim": "#3cddc7",
                    "surface-container-high": "#222a3d",
                    "secondary": "#ffb3b0",
                    "surface-variant": "#2d3449",
                    "surface-tint": "#3cddc7",
                    "inverse-on-surface": "#283044",
                    "error": "#ffb4ab",
                    "on-primary": "#003731",
                    "surface": "#0b1326",
                    "on-primary-fixed": "#00201c",
                    "surface-dim": "#0b1326",
                    "primary-fixed": "#62fae3",
                    "tertiary-container": "#5ec9ff",
                    "primary": "#57f1db",
                    "secondary-container": "#881d24",
                    "on-surface": "#dae2fd",
                    "on-error": "#690005",
                    "background": "#0b1326",
                    "tertiary-fixed": "#c4e7ff",
                    "on-tertiary-container": "#005371",
                    "on-primary-fixed-variant": "#005047",
                    "surface-bright": "#31394d",
                    "on-tertiary-fixed": "#001e2c",
                    "outline": "#859490",
                    "secondary-fixed-dim": "#ffb3b0",
                    "on-secondary-fixed": "#410006",
                    "on-secondary": "#670211",
                    "tertiary": "#afe0ff",
                    "tertiary-fixed-dim": "#7bd0ff",
                    "on-secondary-fixed-variant": "#881d24",
                    "on-secondary-container": "#ff9996",
                    "on-tertiary-fixed-variant": "#004c69",
                    "on-tertiary": "#00354a"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "base": "8px",
                    "margin-desktop": "40px",
                    "xl": "80px",
                    "md": "24px",
                    "margin-mobile": "16px",
                    "lg": "48px",
                    "gutter": "20px",
                    "xs": "4px",
                    "sm": "12px"
            },
            "fontFamily": {
                    "button": [
                            "Hanken Grotesk"
                    ],
                    "label-mono": [
                            "JetBrains Mono"
                    ],
                    "body-base": [
                            "Hanken Grotesk"
                    ],
                    "headline-lg": [
                            "Hanken Grotesk"
                    ],
                    "headline-lg-mobile": [
                            "Hanken Grotesk"
                    ],
                    "display-lg": [
                            "Hanken Grotesk"
                    ],
                    "title-md": [
                            "Hanken Grotesk"
                    ]
            },
            "fontSize": {
                    "button": [
                            "14px",
                            {
                                    "lineHeight": "1.0",
                                    "fontWeight": "600"
                            }
                    ],
                    "label-mono": [
                            "12px",
                            {
                                    "lineHeight": "1.0",
                                    "letterSpacing": "0.05em",
                                    "fontWeight": "500"
                            }
                    ],
                    "body-base": [
                            "16px",
                            {
                                    "lineHeight": "1.6",
                                    "fontWeight": "400"
                            }
                    ],
                    "headline-lg": [
                            "32px",
                            {
                                    "lineHeight": "1.2",
                                    "fontWeight": "600"
                            }
                    ],
                    "headline-lg-mobile": [
                            "24px",
                            {
                                    "lineHeight": "1.2",
                                    "fontWeight": "600"
                            }
                    ],
                    "display-lg": [
                            "48px",
                            {
                                    "lineHeight": "1.1",
                                    "letterSpacing": "-0.02em",
                                    "fontWeight": "700"
                            }
                    ],
                    "title-md": [
                            "20px",
                            {
                                    "lineHeight": "1.4",
                                    "fontWeight": "500"
                            }
                    ]
            }
        },
        },
      }
    </script>
<style>
        /* Custom input number styles to hide arrows */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background min-h-screen text-on-background pb-32">
<!-- Ambient Background Layer -->
<div class="fixed inset-0 pointer-events-none z-0">
<div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-surface-container-high/40 via-background to-background"></div>
</div>
<!-- Top App Bar (Modified for transactional context: no trailing avatar, leading close icon) -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-margin-mobile h-16 bg-surface/70 backdrop-blur-xl border-b border-white/10 shadow-sm">
<div class="flex items-center gap-xs">
<button class="text-primary hover:bg-white/5 transition-colors p-2 rounded-full active:scale-95 duration-200">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<h1 class="font-display-lg text-display-lg-mobile tracking-tight text-primary">Nuevo Conteo</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="relative z-10 pt-24 px-margin-mobile md:px-margin-desktop max-w-[1440px] mx-auto space-y-md">
<!-- Category: Chalecos -->
<div class="bg-surface-container/70 backdrop-blur-md rounded-xl border border-white/10 p-sm shadow-lg">
<div class="flex justify-between items-end gap-md">
<div class="flex-1">
<span class="inline-block bg-primary/10 text-primary font-label-mono text-label-mono px-2 py-1 rounded-full mb-xs">Chalecos Salvavidas</span>
<h2 class="font-title-md text-title-md text-on-surface">Chalecos Talla L</h2>
<p class="font-body-base text-body-base text-on-surface-variant">Sistema: <span class="font-label-mono text-primary ml-1">15</span></p>
</div>
<div class="w-24">
<input class="w-full bg-surface-container-lowest border border-white/10 rounded-lg p-sm text-center font-display-lg text-[24px] text-on-surface focus:ring-1 focus:ring-primary focus:border-primary transition-colors focus:shadow-[inset_0_0_8px_rgba(45,212,191,0.3)]" placeholder="--" type="number"/>
</div>
</div>
</div>
<!-- Category: Remos (Simulated Shortage State) -->
<div class="bg-surface-container/70 backdrop-blur-md rounded-xl border border-error p-sm shadow-lg shadow-error/10 relative overflow-hidden">
<div class="absolute inset-0 bg-error/5 pointer-events-none"></div>
<div class="flex justify-between items-end gap-md relative z-10">
<div class="flex-1">
<span class="inline-block bg-error/10 text-error font-label-mono text-label-mono px-2 py-1 rounded-full mb-xs">Accesorios</span>
<h2 class="font-title-md text-title-md text-on-surface">Remos Kayak</h2>
<p class="font-body-base text-body-base text-on-surface-variant">Sistema: <span class="font-label-mono text-primary ml-1">20</span></p>
</div>
<div class="w-24 relative">
<input class="w-full bg-surface-container-lowest border border-error rounded-lg p-sm text-center font-display-lg text-[24px] text-error focus:ring-1 focus:ring-error focus:border-error transition-colors shadow-[inset_0_0_8px_rgba(255,180,171,0.3)]" type="number" value="18"/>
<span class="absolute -top-3 -right-2 bg-error text-on-error font-label-mono text-[10px] px-1.5 py-0.5 rounded-full shadow-md">-2</span>
</div>
</div>
</div>
<!-- Category: Extintores -->
<div class="bg-surface-container/70 backdrop-blur-md rounded-xl border border-white/10 p-sm shadow-lg">
<div class="flex justify-between items-end gap-md">
<div class="flex-1">
<span class="inline-block bg-primary/10 text-primary font-label-mono text-label-mono px-2 py-1 rounded-full mb-xs">Seguridad</span>
<h2 class="font-title-md text-title-md text-on-surface">Extintores ABC</h2>
<p class="font-body-base text-body-base text-on-surface-variant">Sistema: <span class="font-label-mono text-primary ml-1">4</span></p>
</div>
<div class="w-24">
<input class="w-full bg-surface-container-lowest border border-white/10 rounded-lg p-sm text-center font-display-lg text-[24px] text-on-surface focus:ring-1 focus:ring-primary focus:border-primary transition-colors focus:shadow-[inset_0_0_8px_rgba(45,212,191,0.3)]" placeholder="--" type="number"/>
</div>
</div>
</div>
<!-- Category: Botiquines (Simulated Overage State) -->
<div class="bg-surface-container/70 backdrop-blur-md rounded-xl border border-primary p-sm shadow-lg shadow-primary/10 relative overflow-hidden">
<div class="absolute inset-0 bg-primary/5 pointer-events-none"></div>
<div class="flex justify-between items-end gap-md relative z-10">
<div class="flex-1">
<span class="inline-block bg-primary/10 text-primary font-label-mono text-label-mono px-2 py-1 rounded-full mb-xs">Seguridad</span>
<h2 class="font-title-md text-title-md text-on-surface">Botiquines</h2>
<p class="font-body-base text-body-base text-on-surface-variant">Sistema: <span class="font-label-mono text-primary ml-1">5</span></p>
</div>
<div class="w-24 relative">
<input class="w-full bg-surface-container-lowest border border-primary rounded-lg p-sm text-center font-display-lg text-[24px] text-primary focus:ring-1 focus:ring-primary focus:border-primary transition-colors shadow-[inset_0_0_8px_rgba(87,241,219,0.3)]" type="number" value="6"/>
<span class="absolute -top-3 -right-2 bg-primary text-on-primary font-label-mono text-[10px] px-1.5 py-0.5 rounded-full shadow-md">+1</span>
</div>
</div>
</div>
</main>
<!-- Transactional Bottom Bar (Supersedes standard global nav) -->
<div class="fixed bottom-0 w-full z-50 bg-surface-container/90 backdrop-blur-xl border-t border-white/10 shadow-2xl px-margin-mobile py-sm">
<div class="flex flex-col gap-xs mb-sm">
<div class="flex justify-between items-center font-label-mono text-label-mono">
<span class="text-on-surface-variant">Progreso</span>
<span class="text-primary">2/4 categorías</span>
</div>
<div class="w-full h-1 bg-surface-container-lowest rounded-full overflow-hidden">
<div class="h-full bg-primary w-1/2 rounded-full"></div>
</div>
</div>
<button class="w-full bg-primary text-on-primary font-button text-button uppercase py-3 rounded-lg hover:bg-primary-fixed transition-colors shadow-[inset_0_0_8px_rgba(255,255,255,0.4)] active:scale-95 duration-150">
            Cerrar el Conteo
        </button>
</div>
</body></html>
